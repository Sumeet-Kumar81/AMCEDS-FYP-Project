# Alembic configuration (B1-A1-06). Run from the backend/ folder, e.g.
#   docker compose run --rm api alembic upgrade head
# The database URL is NOT stored here: migrations/env.py reads DATABASE_URL from the environment
# (or from .env through app.core.config). Never put a password in this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Revision files are named <rev>_<slug>.py; give each new revision the next number with --rev-id,
# e.g. alembic revision --autogenerate --rev-id 0002 -m "initial schema"
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
