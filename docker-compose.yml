# Day 1 stack: postgres(+PostGIS) + api. Other services are added on the day shown.
services:
  postgres:
    image: postgis/postgis:15-3.4
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8000:8000"]
    volumes: ["./backend:/code"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # AI worker (B1-A2-14, CR-004): same image as the API; reads saved reports from the database queue.
  # Code changes need `docker compose restart ai-worker` (no auto-reload).
  ai-worker:
    build: ./backend
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    volumes: ["./backend:/code"]
    command: python -m app.workers.ai_worker
    stop_grace_period: 40s  # lets a running job finish (the worker stops cleanly on SIGTERM)

  # ---- ADD LATER ----
  # osrm (Day 3): routing container, data in infra/osrm
  # nginx (Day 27): TLS + static builds
  # sms-simulator (Day 22)
  # ollama (optional): local LLM

volumes:
  pgdata:
